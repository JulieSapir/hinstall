[package]
name = "hinstall"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- HAP 签名（移植自 deprecated/crates/hap-sign）---
sha2 = { version = "0.11.0", features = ["oid"] }
# rsa 0.9.10 仍基于 digest 0.10 / sha2 0.10（0.10 正式版尚未发布），只能并行引入
sha2_10 = { package = "sha2", version = "0.10.9", features = ["oid"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
ecdsa = { version = "0.17.0", features = ["der"] }
rsa = "0.9.10"
base64 = "0.23.1"
miniz_oxide = "0.9.1"
# 0.10 是纯 trait crate（无 feature、无 OsRng），p256/p384 用它
rand_core = "0.10.1"
# rsa 0.9 仍依赖 rand_core 0.6，需要一个该代的 OsRng
rand_core06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
# sys_rng 打开 SysRng（实现 rand_core 0.10 的 TryRng/TryCryptoRng）
getrandom = { version = "0.4.3", features = ["sys_rng"] }

# --- HDC over USB（移植自 deprecated/crates/hdc-usb）---
nusb = "0.2.7"
futures-lite = "2.6.1"

# --- HTTPS 客户端 ---
libc = "0.2.189"
ureq = { version = "3.4.2", features = ["gzip"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
